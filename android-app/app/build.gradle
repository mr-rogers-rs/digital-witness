plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

// Release signing is opt-in and identity-bearing, so the keystore + its
// passwords live OUTSIDE the repo. Drop a `keystore.properties` next to this
// file (see keystore.properties.example) to enable a signed release build.
// When the file is absent the release build stays UNSIGNED (its prior
// behaviour), so cloning + building still works without any secret material.
def keystorePropsFile = rootProject.file("app/keystore.properties")
def keystoreProps = new Properties()
def hasReleaseSigning = keystorePropsFile.exists()
if (hasReleaseSigning) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace "com.fieldnotes.recorder"
    compileSdk 34
    // Pinned for reproducible builds. Without this, AGP silently selects the
    // HIGHEST installed build-tools, so two machines with different SDKs produce
    // different bytes from identical source — the exact failure a reproducible
    // build exists to prevent. Pinned means a machine missing 34.0.0 fails with
    // a clear "install build-tools 34.0.0" error instead of diverging quietly.
    // See docs/reproducible_builds.md §1.
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.fieldnotes.recorder"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "0.4.7"
        testInstrumentationRunner "com.fieldnotes.recorder.capture.MuxRegressionInstrumentation"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty("storeFile"))
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // AGP embeds git metadata (commit SHA, VCS type) into release APKs
            // by default, in META-INF/version-control-info.textproto. Today it
            // happens to emit NO_SUPPORTED_VCS_FOUND only because `.git` sits
            // one level above the Gradle root — a differently-structured
            // checkout, or building from a repo root, would stamp the commit
            // into the artifact. That is both an identity leak and a
            // reproducibility breaker, so pin it off rather than relying on
            // directory layout. See docs/reproducible_builds.md.
            vcsInfo {
                include false
            }
            // Only attach the signing config when a keystore.properties is
            // present; otherwise the release artifact is produced unsigned and
            // must be signed out-of-band (or built reproducibly for F-Droid,
            // which signs with its own key). See docs/anonymous_distribution.md.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    // Reproducible builds: AGP otherwise injects an encrypted "dependency
    // metadata" block (signed with a Google key) into the APK/AAB. It is both a
    // reproducibility-breaker (opaque, build-dependent) and an avoidable bit of
    // information disclosure. Disable it. See docs/reproducible_builds.md.
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

// Pin transitive dependency versions so the resolved graph is identical across
// machines (a prerequisite for byte-identical output). Regenerate after any
// dependency change with:  ./gradlew :app:dependencies --write-locks
dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("com.google.android.material:material:1.12.0")

    implementation("androidx.camera:camera-core:1.3.4")
    implementation("androidx.camera:camera-camera2:1.3.4")
    implementation("androidx.camera:camera-lifecycle:1.3.4")

    implementation("androidx.work:work-runtime-ktx:2.9.1")

    implementation("com.squareup.okhttp3:okhttp:4.12.0")

    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

    // At-rest encryption is self-managed (secure/SecureFile, secure/SecurePrefs)
    // on the Android Keystore — the unmaintained androidx.security:security-crypto
    // alpha was dropped (design doc §4.3).

    implementation("androidx.documentfile:documentfile:1.0.1")
}
